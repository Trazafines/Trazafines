<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trazafines | Logística Integral</title>
    
    <link rel="icon" type="image/png" href="Isotipo_sinfondo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        :root { 
            --primario: #0047ab; 
            --secundario: #002d6b;
            --whatsapp: #25d366; 
            --oscuro: #333; 
            --claro: #f4f4f4; 
        }

        /* --- ESTILOS BASE --- */
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f9f9f9; color: var(--oscuro); scroll-behavior: smooth; overflow-x: hidden; }

        /* Navegación */
        nav { 
            background: white; padding: 10px 5%; display: flex; 
            justify-content: space-between; align-items: center; 
            position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; 
        }
        .logo-nav { height: 40px; width: auto; }
        .nav-links { list-style: none; display: flex; gap: 20px; align-items: center; margin: 0; padding: 0; }
        .nav-links a { text-decoration: none; color: var(--oscuro); font-weight: 500; font-size: 0.9rem; }
        .btn-nav-alta { background: var(--primario); color: white !important; padding: 8px 15px; border-radius: 5px; font-weight: bold !important; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; display: none; font-weight: bold; }

        /* Hero Principal */
        .hero { 
            background: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('el-cerro-de-la-silla.jpg'); 
            height: 80vh; min-height: 500px; background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px;
        }
        .logo-hero { width: 85%; max-width: 380px; height: auto; margin-bottom: 20px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1)); }
        .hero p { font-size: 1.2rem; margin-bottom: 30px; max-width: 600px; }

        /* --- SECCIÓN DE ACCESO Y OPERACIÓN --- */
        #seccion-operativa { padding: 60px 5%; background: var(--primario); color: white; text-align: center; }

        /* Tarjetas de Login y Formulario */
        .card-container { 
            max-width: 900px; margin: 0 auto; background: white; 
            padding: 30px; border-radius: 20px; color: var(--oscuro); box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
        }
        input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 1rem; }
        .btn-action { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 8px; background: var(--primario); color: white; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn-action:hover { background: var(--secundario); }

        /* MODAL DE MAPAS (Basado en el código de tu amigo) */
        #modal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:2000;
        }
        .modal-content { background:white; padding:25px; border-radius:20px; width:95%; max-width:1000px; max-height:90vh; overflow-y:auto; }
        
        .grid-mapas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .mapa-box { height: 250px; border-radius: 12px; border: 2px solid #eee; position: relative; }

        @media (max-width: 768px) {
            .grid-mapas { grid-template-columns: 1fr; }
            .hero { height: 60vh; }
        }

        .lista-colonias { border: 1px solid #ddd; border-radius: 8px; max-height: 100px; overflow: auto; background: #fff; margin-top: 5px; font-size: 12px; }
        .lista-colonias div { padding: 8px; cursor: pointer; }
        .lista-colonias div:hover { background: var(--primario); color: white; }
    </style>
</head>
<body>

    <nav>
        <a href="#"><img src="Isotipo_sinfondo.png" alt="Logo" class="logo-nav"></a>
        <ul class="nav-links">
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#seccion-operativa" class="btn-nav-alta">Servicios</a></li>
            <li><button id="btn-logout" class="btn-logout" onclick="handleLogout()">Cerrar Sesión</button></li>
        </ul>
    </nav>

    <section class="hero" id="inicio">
        <img src="trazafines.png" alt="Trazafines" class="logo-hero">
        <p>Expertos en logística y distribución local.</p>
    </section>

    <section id="seccion-operativa">
        
        <div id="auth-view" class="card-container">
            <h2 style="color: var(--primario);">Acceso Clientes</h2>
            <p>Inicia sesión para solicitar un repartidor</p>
            <input type="email" id="login-email" placeholder="Correo electrónico">
            <input type="password" id="login-password" placeholder="Contraseña">
            <button class="btn-action" onclick="handleLogin()">Entrar</button>
            <button class="btn-action" style="background: #6c757d;" onclick="handleRegister()">Registrarse</button>
        </div>

        <div id="form-solicitud-view" style="display: none;" class="card-container">
            <h2 style="color: var(--primario);">Panel de Solicitud</h2>
            <input id="negocio-nombre" placeholder="Nombre de tu Negocio">
            <div style="background: #eef2f7; padding: 15px; border-radius: 10px; margin: 20px 0; font-size: 0.9rem; color: #555;">
                Haz clic en <b>"Nueva Solicitud"</b> para capturar direcciones en el mapa.
            </div>
            <button class="btn-action" onclick="abrirModal()" style="background: var(--whatsapp);">+ Nueva Solicitud de Repartidor</button>
        </div>

    </section>

    <div id="modal">
        <div class="modal-content">
            <h3 style="color: var(--primario); margin-top:0;">Captura de Direcciones</h3>
            
            <div class="grid-mapas">
                <div>
                    <label>📍 Punto de Recolección</label>
                    <input id="dir1" placeholder="Calle, Número, Colonia">
                    <button class="btn-action" style="padding: 8px; font-size: 0.8rem;" onclick="buscar1()">Buscar en Mapa</button>
                    <input id="cp1" placeholder="CP">
                    <div id="colonias1" class="lista-colonias"></div>
                </div>
                <div id="mapa1" class="mapa-box"></div>

                <div>
                    <label>🏁 Punto de Entrega</label>
                    <input id="dir2" placeholder="Calle, Número, Colonia">
                    <button class="btn-action" style="padding: 8px; font-size: 0.8rem;" onclick="buscar2()">Buscar en Mapa</button>
                    <input id="cp2" placeholder="CP">
                    <div id="colonias2" class="lista-colonias"></div>
                </div>
                <div id="mapa2" class="mapa-box"></div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-action" style="background: var(--whatsapp);" onclick="validarYEnviar()">Confirmar y Enviar</button>
                <button class="btn-action" style="background: #666;" onclick="cerrar()">Cancelar</button>
            </div>
        </div>
    </div>

    <footer style="text-align: center; padding: 30px; background: #222; color: white;">
        <p>&copy; 2026 Trazafines Logística | Santa Catarina, N.L.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhM6EzdUvaWOYczUg_4McUsHr3nyOOXM8",
            authDomain: "trazafines-login.firebaseapp.com",
            projectId: "trazafines-login",
            storageBucket: "trazafines-login.firebasestorage.app",
            messagingSenderId: "800521304253",
            appId: "1:800521304253:web:06bbc8900103723bd91fd4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleLogin = () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert("Error: " + err.message));
        };

        window.handleRegister = () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            createUserWithEmailAndPassword(auth, email, pass).then(() => alert("Cuenta creada.")).catch(err => alert("Error: " + err.message));
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            const authView = document.getElementById('auth-view');
            const formView = document.getElementById('form-solicitud-view');
            const logoutBtn = document.getElementById('btn-logout');
            if (user) {
                authView.style.display = 'none';
                formView.style.display = 'block';
                logoutBtn.style.display = 'block';
            } else {
                authView.style.display = 'block';
                formView.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });
    </script>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxLw_b7_Rpy6z44kKDBt0zazi11EniyqXFZxJtSgOC6wjpLSOG7RU50mICZg0Cw5XRM/exec';
        let mapa1, mapa2, marker1, marker2;

        function abrirModal(){
            document.getElementById("modal").style.display="flex";
            setTimeout(iniciarMapas, 300);
        }
        function cerrar(){ document.getElementById("modal").style.display="none"; }

        function iniciarMapas(){
            if(!mapa1){
                mapa1 = L.map('mapa1').setView([25.68, -100.31], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa1);
                mapa1.on('click', e => { ponerMarker(e.latlng, 1); reverseGeocode(e.latlng, 1); });
            }
            if(!mapa2){
                mapa2 = L.map('mapa2').setView([25.68, -100.31], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa2);
                mapa2.on('click', e => { ponerMarker(e.latlng, 2); reverseGeocode(e.latlng, 2); });
            }
            mapa1.invalidateSize(); mapa2.invalidateSize();
        }

        function ponerMarker(pos, num){
            if(num === 1){ if(marker1) mapa1.removeLayer(marker1); marker1 = L.marker(pos).addTo(mapa1); }
            else { if(marker2) mapa2.removeLayer(marker2); marker2 = L.marker(pos).addTo(mapa2); }
        }

        function reverseGeocode(pos, num){
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.lat}&lon=${pos.lng}`)
            .then(r => r.json()).then(d => {
                document.getElementById('dir'+num).value = d.display_name;
            });
        }

        function validarYEnviar(){
            const d1 = document.getElementById('dir1').value;
            const d2 = document.getElementById('dir2').value;
            const negocio = document.getElementById('negocio-nombre').value;

            if(!d1 || !d2 || !negocio){ alert("Por favor llena todos los campos"); return; }

            // Guardar en Google Sheets en segundo plano
            const formData = new FormData();
            formData.append("nombre", negocio);
            formData.append("nombreEmpresa", "Solicitud Mapa");
            formData.append("email", "S/N");
            formData.append("celular", d1); // Guardamos la ruta en los campos existentes
            formData.append("telefonoFijo", d2);
            formData.append("servicio", "Logística");

            fetch(scriptURL, { method: 'POST', body: formData })
            .then(() => {
                const msg = `Trazafines Solicitud:\nNegocio: ${negocio}\n\nRecoger en: ${d1}\nEntregar en: ${d2}`;
                window.open(`https://wa.me/5218112209919?text=${encodeURIComponent(msg)}`, '_blank');
                cerrar();
            });
        }
    </script>
</body>
</html>
