<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trazafines | Privado</title>
    <style>
        :root { --primario: #0047ab; --secundario: #28a745; --oscuro: #333; --claro: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--oscuro); }
        
        /* Pantalla de Login */
        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; background: var(--primario); color: white;
        }
        .login-card { background: white; padding: 30px; border-radius: 10px; color: var(--oscuro); width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-card input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;}
        .btn-login { width: 100%; background: var(--primario); color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; font-weight: bold; }

        /* Ocultar contenido principal por defecto */
        #main-content { display: none; }

        /* Estilos de tu página original (los mantuve igual) */
        nav { background: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 1000; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1200&q=80'); height: 60vh; background-size: cover; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .form-alta { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .form-alta input, .form-alta select { padding: 12px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-enviar { background: var(--primario); color: white; padding: 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-logout { background: #ff4444; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>Trazafines Portal</h1>
        <div class="login-card">
            <p>Inicia sesión para acceder</p>
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button class="btn-login" onclick="login()">Entrar</button>
            <p id="error-msg" style="color: red; font-size: 12px; display: none;">Datos incorrectos</p>
        </div>
    </div>

    <div id="main-content">
        <nav>
            <div class="logo">Trazafines</div>
            <ul>
                <li><a href="#valores">Valores</a></li>
                <li><a href="#rastreo">Rastreo</a></li>
                <li><a href="#registro">Alta Clientes</a></li>
                <li><button class="btn-logout" onclick="logout()">Salir</button></li>
            </ul>
        </nav>

        <section class="hero">
            <h1>Bienvenidos a Trazafines</h1>
            <p>Soluciones logísticas y de transporte a tu medida.</p>
            <a href="https://wa.me/8112209919?text=Hola!" class="btn-whatsapp" style="background: var(--secundario); color: white; padding: 15px 30px; border-radius: 50px; text-decoration: none;">📱 Cotizar</a>
        </section>

        <section id="registro">
            <h2>Alta de Nuevos Clientes</h2>
            <form class="form-alta" action="https://script.google.com/macros/s/AKfycbxLw_b7_Rpy6z44kKDBt0zazi11EniyqXFZxJtSgOC6wjpLSOG7RU50mICZg0Cw5XRM/exec" method="POST">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <input type="email" name="email" placeholder="Correo" required>
                <input type="text" name="nombreEmpresa" placeholder="Empresa">
                <input type="tel" name="celular" placeholder="Celular">
                <input type="tel" name="telefonoFijo" placeholder="Tel Fijo">
                <select name="servicio">
                    <option value="General">Servicio General</option>
                    <option value="Especial">Carga Especial</option>
                </select>
                <button type="submit" class="btn-enviar">Enviar Registro</button>
            </form>
        </section>
        
        <footer>
            <p>&copy; 2026 Trazafines | Santa Catarina, Nuevo León</p>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURA AQUÍ TUS DATOS DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Función para Loguear
        window.login = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch(error => { document.getElementById('error-msg').style.display = 'block'; });
        };

        // Función para Salir
        window.logout = () => { signOut(auth); };

        // Observador: Si hay usuario, muestra la web; si no, el login
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        });
    </script>
</body>
</html>
