<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Trazafines | Logística Integral</title>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

</head>
<body>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIGURACIÓN (REEMPLAZA ESTOS DATOS)
        const SUPABASE_URL = "https://jqsxdbcalqpsutdaskof.supabase.co/rest/v1/"; 
        const SUPABASE_KEY = "sb_publishable_VdaMSx1OXbZ8umdmq41jwQ_ItGTRLH2";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // ... (Tu código de Firebase sigue igual) ...
        
        // --- SUSTITUCIÓN DE FUNCIONES POR SUPABASE ---

        window.guardarPerfilYMatriz = async function() {
            const emp = document.getElementById("negocio-nombre").value.trim();
            const tel = document.getElementById("negocio-celular").value.trim();
            const dirMatriz = document.getElementById("dir1").value.trim();

            if(!dirMatriz) return alert("Ubica tu matriz en el mapa.");

            const { error } = await supabase.from('perfiles').upsert({
                email: window.correoUsuarioActual,
                empresa: emp,
                telefono: tel,
                direccion_matriz: dirMatriz
            }, { onConflict: 'email' });

            if(error) alert("Error: " + error.message);
            else {
                window.evaluarEstadoPerfil({ empresa: emp, telefono: tel, direccion: dirMatriz });
                actualizarInterfazSesion(emp);
                cerrarModalMapa();
                alert("¡Perfil guardado en Supabase!");
            }
        };

        window.validarYEnviar = async function() {
            const d1 = document.getElementById('dir1').value.trim();
            const d2 = document.getElementById('dir2').value.trim();
            const nombreDest = document.getElementById('nombre-destinatario').value.trim();
            const telDest = document.getElementById('tel-destinatario').value.trim();
            const paquetes = document.getElementById('num-paquetes').value;

            const { error } = await supabase.from('pedidos').insert([{
                email_cliente: window.correoUsuarioActual,
                empresa: window.perfilUsuario.empresa,
                telefono_cliente: window.perfilUsuario.telefono,
                origen: d1,
                destino: d2,
                nombre_destinatario: nombreDest,
                telefono_destinatario: telDest,
                paquetes: paquetes,
                estatus: 'Nuevo Pedido'
            }]);

            if(error) alert("Error al registrar: " + error.message);
            else {
                alert("Pedido registrado en Supabase.");
                window.open(`https://wa.me/5218112209919?text=Nuevo Pedido`, "_blank");
                cerrarModalMapa();
            }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();
            
            const { data, error } = await supabase
                .from('perfiles')
                .select('*')
                .eq('email', email)
                .eq('contrasena', pass)
                .single();

            if(error || !data) alert("Credenciales incorrectas.");
            else {
                window.correoUsuarioActual = email;
                actualizarInterfazSesion(data.empresa);
                window.evaluarEstadoPerfil({ empresa: data.empresa, telefono: data.telefono, direccion: data.direccion_matriz });
                cerrarModalLogin();
            }
        };
    </script>
</body>
</html>
