<script>
        // 1. CONFIGURACIÓN DE SUPABASE (PON TUS NUEVAS LLAVES AQUÍ)
        const SUPABASE_URL = "https://jqsxdbcalqpsutdaskof.supabase.co/rest/v1/"; 
        const SUPABASE_KEY = "sb_publishable_DptS8CT7OS17X5TkrP5m-w_ycWfdB-z";
        
        // EL ARREGLO: Le cambiamos el nombre para que no choque
        const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('registro-form');
        const msgStatus = document.getElementById('msg-status');
        const btnSubmit = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Estado de carga
            btnSubmit.innerText = "Registrando... ⏳";
            btnSubmit.disabled = true;
            msgStatus.textContent = "";
            msgStatus.className = "mensaje";

            // Recolección de datos exactos a como se llaman las columnas en tu tabla
            const datosRegistro = {
                nombres: document.getElementById('nombres').value.trim(),
                apellidos: document.getElementById('apellidos').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                empresa: document.getElementById('empresa').value.trim(),
                email: document.getElementById('email').value.trim(),
                contrasena: document.getElementById('password').value.trim()
            };

            // Inserción en la base de datos (Usando el nuevo nombre)
            const { error } = await clienteSupabase.from('perfiles').insert([datosRegistro]);

            if (error) {
                // Si el correo ya existe, Supabase mandará un error que aquí atrapamos
                msgStatus.textContent = "Error: Es posible que este correo ya esté registrado. (" + error.message + ")";
                msgStatus.classList.add("error");
                btnSubmit.innerText = "Crear Cuenta";
                btnSubmit.disabled = false;
            } else {
                // Éxito total
                msgStatus.textContent = "¡Cuenta creada con éxito! Puedes cerrar esta ventana e iniciar sesión.";
                msgStatus.classList.add("exito");
                btnSubmit.innerText = "✅ Registrado";
                form.reset();
                
                // Cierra la pestaña automáticamente después de 3 segundos
                setTimeout(() => {
                    window.close();
                }, 3000);
            }
        });
    </script>
